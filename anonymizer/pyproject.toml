[project]
name = "s1d1-anonymizer"
version = "0.1.0"
description = "Turns the raw s1d1 captures into the anonymised clean corpus (GLiNER + validated patterns)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage>=3.17,<4",
    "boto3>=1.43,<2",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
# The models: installed by the image (Task 7), the slow tests and scripts/fetch_models.py, never by CI's fast tests.
model = [
    "gliner>=0.2.29,<0.3",
    "torch>=2.14,<3",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

# PyTorch comes from the CPU index: the service runs on CPU (Cloud Run), and the PyPI Linux wheel pulls the CUDA
# libraries (gigabytes) for nothing. `explicit = true` keeps every other package on PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: loads the real GLiNER model (downloaded from the Hugging Face Hub); excluded from CI with -m \"not slow\"",
]

[tool.ruff]
line-length = 120
