# Base CI for s1d1-alliance. Every action is pinned by full commit SHA; the version is in the comment.
# A job or step whose directory does not exist yet is skipped (hashFiles returns an empty string).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full git history
        run: gitleaks git --redact --verbose

  workers:
    name: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        if: hashFiles('workers/**') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run the Worker tests
        if: hashFiles('workers/**') != ''
        run: node --test "workers/**/*.test.js"

  anonymizer:
    name: anonymizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv 0.11.26
        if: hashFiles('anonymizer/**') != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.26"

      - name: Run the fast tests (slow marker excluded)
        if: hashFiles('anonymizer/**') != ''
        working-directory: anonymizer
        run: uv run --python 3.12 pytest -q -m "not slow"

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform 1.16.6
        if: hashFiles('terraform/**') != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check formatting
        if: hashFiles('terraform/**') != ''
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Validate without a backend
        if: hashFiles('terraform/**') != ''
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
