name: Bug report
description: The instance, a Worker, the anonymiser or the Terraform does something it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability does not go here: report it privately, as SECURITY.md says.
        Do not paste real prompts that contain personal data, nor tokens or keys.
  - type: input
    id: where
    attributes:
      label: URL or path
      description: The URL you called, or the file or component concerned.
      placeholder: https://s1d1.qoo.gy/api/...
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request format
      description: The method, the headers that matter and a body with invented data (a `curl` is ideal). No token.
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Response status
      placeholder: "429"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time (UTC)
      placeholder: 2026-10-25 14:03
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: The response body or the error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
